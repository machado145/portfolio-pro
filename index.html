<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portefólio Pro">
<title>Portefólio Pro</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0f1e31;
  --panel2:#14263d;
  --text:#eef5ff;
  --muted:#92a6bf;
  --line:#273d59;
  --blue:#5b8cff;
  --green:#34d399;
  --red:#fb7185;
  --amber:#fbbf24;
  --shadow:0 18px 46px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 85% -10%,#173961 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{font:inherit}

.app{
  display:grid;
  grid-template-columns:245px minmax(0,1fr);
  min-height:100vh;
}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:24px 15px;
  border-right:1px solid var(--line);
  background:rgba(7,17,31,.92);
}

.brand{
  display:flex;
  gap:11px;
  align-items:center;
  margin:0 9px 26px;
  font-size:18px;
  font-weight:850;
}

.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--green));
}

.nav button{
  width:100%;
  padding:11px 12px;
  margin:3px 0;
  border:0;
  border-radius:11px;
  color:var(--muted);
  background:transparent;
  text-align:left;
  cursor:pointer;
}

.nav button:hover,
.nav button.active{
  color:var(--text);
  background:var(--panel2);
}

.main{
  width:100%;
  max-width:1580px;
  margin:auto;
  padding:27px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:22px;
}

.header h1{
  margin:0;
  font-size:29px;
}

.actions,.toolbar,.periods{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn,.input,select{
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  background:var(--panel);
}

.btn{cursor:pointer}

.btn.primary{
  border-color:var(--blue);
  color:#fff;
  background:linear-gradient(135deg,var(--blue),#2874ec);
}

.btn.danger{
  border-color:var(--red);
  color:#fff;
  background:var(--red);
}

.btn.active{
  border-color:var(--blue);
  background:var(--blue);
}

.view{display:none}
.view.active{display:block}

.db-status{
  display:inline-flex;
  gap:7px;
  align-items:center;
  margin-top:7px;
  padding:6px 10px;
  border-radius:20px;
  color:var(--green);
  background:#34d39918;
  font-size:12px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
}

.kpis{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:13px;
}

.card{
  padding:17px;
  margin-bottom:13px;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(155deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.label{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.value{
  margin-top:7px;
  font-size:24px;
  font-weight:850;
}

.muted{color:var(--muted)}
.positive{color:var(--green)!important}
.negative{color:var(--red)!important}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.section-head h2{margin:0}

.progress{
  height:8px;
  margin-top:8px;
  overflow:hidden;
  border-radius:8px;
  background:var(--line);
}

.progress span{
  display:block;
  height:100%;
  border-radius:8px;
}

.bar-row{margin:13px 0}

.bar-label{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.filters{
  display:grid;
  grid-template-columns:2fr repeat(4,1fr) auto;
  gap:8px;
  margin:14px 0;
}

.table-wrap{overflow:auto}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

th,td{
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.sort{
  padding:0;
  border:0;
  color:var(--muted);
  background:transparent;
  cursor:pointer;
  text-transform:uppercase;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:14px;
  color:#89abff;
  background:#5b8cff22;
}

.chart-wrap{
  position:relative;
  height:380px;
}

.chart-wrap canvas{
  width:100%;
  height:100%;
}

.legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:10px;
}

.legend-item{
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--muted);
}

.legend-dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.tooltip{
  position:absolute;
  z-index:5;
  display:none;
  pointer-events:none;
  min-width:150px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#07111fee;
  box-shadow:0 10px 28px #0008;
  font-size:12px;
}

.empty{
  padding:25px;
  color:var(--muted);
  text-align:center;
}

.notice{
  margin-top:10px;
  padding:11px 12px;
  border-left:3px solid var(--amber);
  border-radius:8px;
  background:#fbbf2412;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field label{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:12px;
}

.field input,.field select{width:100%}
.full{grid-column:1/-1}

dialog{
  width:min(680px,94vw);
  border:1px solid var(--line);
  border-radius:17px;
  color:var(--text);
  background:var(--panel);
}

dialog::backdrop{background:#000a}

.dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

@media(max-width:1150px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr 1fr}
}

@media(max-width:760px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .app{display:block}

  .sidebar{
    position:fixed;
    z-index:20;
    top:auto;
    right:0;
    bottom:0;
    left:0;
    height:auto;
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    border:0;
    border-top:1px solid var(--line);
  }

  .brand{display:none}
  .nav{display:flex;justify-content:space-around}

  .nav button{
    width:auto;
    padding:8px 6px;
    font-size:11px;
    text-align:center;
  }

  .main{padding:15px}
  .header{display:block}
  .actions{margin-top:12px}
  .kpis{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .chart-wrap{height:320px}
}

@media(max-width:430px){
  .kpis{grid-template-columns:1fr}
}
</style>
</head>

    <button data-view="investimentos">Investimentos</button>
